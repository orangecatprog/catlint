name: "Bug Report"
description: "Report a bug"
title: "[BUG] "
labels: ["bug"]

body:
  - type: textarea
    id: description
    attributes:
      label: "Bug description"
      placeholder: "Describe the bug"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
      placeholder: "1. Go to...\n2. Click...\n3. Error"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
      placeholder: "What should happen?"
    validations:
      required: true
